name: FleetNexus CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleetnexus
          POSTGRES_PASSWORD: fleetnexus
          POSTGRES_DB: fleetnexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetnexus -d fleetnexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fleetnexus:fleetnexus@localhost:5432/fleetnexus_test?schema=public
      TEST_DATABASE_URL: postgresql://fleetnexus:fleetnexus@localhost:5432/fleetnexus_test?schema=public
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://127.0.0.1:3000
      WEB_ORIGIN: http://127.0.0.1:3000
      API_INTERNAL_URL: http://127.0.0.1:4000/api
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:4000/leads
      NEXT_PUBLIC_GOOGLE_ADS_ID: AW-11460691521
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      BCRYPT_ROUNDS: 4
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: apps/api

      - name: Migrate check
        run: |
          npm run prisma:migrate
          npm run prisma:migrate:check
        working-directory: apps/api

      - name: Seed test data
        run: npm run prisma:seed
        working-directory: apps/api

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Type-check web
        run: npm run type-check
        working-directory: apps/web

      - name: Lint web
        run: npm run lint
        working-directory: apps/web

      - name: Build web
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_GOOGLE_ADS_ID: AW-11460691521

      - name: API tests
        run: npm run test:api
        working-directory: apps/api

      - name: Install Playwright browsers
        run: npm run playwright:install
        working-directory: apps/web

      - name: Start API
        run: |
          nohup npm run start:prod > /tmp/fleetnexus-api.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4000/api/auth/csrf && exit 0
            sleep 2
          done
          cat /tmp/fleetnexus-api.log
          exit 1
        working-directory: apps/api

      - name: Start web
        env:
          NEXT_PUBLIC_GOOGLE_ADS_ID: AW-11460691521
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/fleetnexus-web.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/login && exit 0
            sleep 2
          done
          cat /tmp/fleetnexus-web.log
          exit 1
        working-directory: apps/web

      - name: Playwright E2E tests
        run: npm run test:e2e
        working-directory: apps/web
        env:
          E2E_SKIP_WEB_SERVER: "1"
          E2E_WEB_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_GOOGLE_ADS_ID: AW-11460691521
          E2E_API_URL: http://127.0.0.1:4000/api
          E2E_ADMIN_EMAIL: admin@fleetnexus.com
          E2E_ADMIN_PASSWORD: Admin@123
          E2E_AGENT_EMAIL: agent1@fleetnexus.com
          E2E_AGENT_PASSWORD: Agent@123

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  load-smoke:
    runs-on: ubuntu-latest
    needs: build-lint-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Validate k6 scripts
        run: |
          k6 inspect tests/load/lead-submissions.k6.js
          k6 inspect tests/load/auth-bursts.k6.js
          k6 inspect tests/load/websocket-connections.k6.js
